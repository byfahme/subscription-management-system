<!DOCTYPE html>
<html>

<head>
    <title>New template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <h1>New quotation template</h1>
    <form method="post" class="col-md-6">
        <label class="form-label">Name</label>
        <input name="name" class="form-control mb-2" required>
        <label class="form-label">Plan</label>
        <select name="plan_id" class="form-select mb-2">
            <option value="">None</option>
            {% for p in plans %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
        <label class="form-label">Validity (days)</label>
        <input name="validity_days" type="number" class="form-control mb-2" value="30">
        <label class="form-label">Product</label>
        <select name="product_id" class="form-select mb-2" required>
            {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
        <label class="form-label">Qty</label>
        <input name="qty" type="number" class="form-control mb-3" value="1">
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('catalog.templates') }}" class="btn btn-secondary">Back</a>
    </form>
</body>

</html>
