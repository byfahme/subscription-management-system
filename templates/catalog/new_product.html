<!DOCTYPE html>
<html>

<head>
    <title>New product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <head>
        {% include "catalog/_style.html" %}
    </head>

<body class="container mt-4">
    <h1>New product</h1>
    <form method="post" class="col-md-6">
        <label class="form-label">Name</label>
        <input name="name" class="form-control mb-2" required>
        <label class="form-label">Type</label>
        <input name="type" class="form-control mb-2">
        <label class="form-label">Sales price</label>
        <input name="sales_price" type="number" step="0.01" class="form-control mb-2" value="0">
        <label class="form-label">Cost price</label>
        <input name="cost_price" type="number" step="0.01" class="form-control mb-2" value="0">
        <label class="form-label">Tax %</label>
        <input name="tax_percent" type="number" step="0.01" class="form-control mb-2" value="0">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control mb-3"></textarea>
        <button class="btn btn-primary">Save</button>
        <a href="{{ url_for('catalog.products') }}" class="btn btn-secondary">Back</a>
    </form>
</body>

</html>
