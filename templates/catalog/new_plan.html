<!DOCTYPE html>
<html>
<head>
  <title>New plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h1>New plan</h1>
  <form method="post" class="col-md-6">
    <label class="form-label">Name</label>
    <input name="name" class="form-control mb-2" required>
    <label class="form-label">Price</label>
    <input name="price" type="number" step="0.01" class="form-control mb-2" value="0">
    <label class="form-label">Period</label>
    <select name="period" class="form-select mb-2">
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly" selected>Monthly</option>
      <option value="yearly">Yearly</option>
    </select>
    <label class="form-label">Min qty</label>
    <input name="min_qty" type="number" class="form-control mb-2" value="1">
    <label class="form-label">Start date</label>
    <input name="start_date" type="date" class="form-control mb-2">
    <label class="form-label">End date</label>
    <input name="end_date" type="date" class="form-control mb-2">
    <div class="form-check"><input class="form-check-input" type="checkbox" name="auto_close" id="ac"><label class="form-check-label" for="ac">Auto close after end date</label></div>
    <div class="form-check"><input class="form-check-input" type="checkbox" name="allow_pause" id="ap"><label class="form-check-label" for="ap">Allow pause</label></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="allow_renew" id="ar"><label class="form-check-label" for="ar">Allow renew</label></div>
    <button class="btn btn-primary">Save</button>
    <a href="{{ url_for('catalog.plans') }}" class="btn btn-secondary">Back</a>
  </form>
</body>
</html>
