<!DOCTYPE html>
<html>

<head>
    <title>New subscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">
    <h1>New subscription</h1>
    <form method="post" class="col-md-6">
        <label class="form-label">Customer</label>
        <select name="customer_id" class="form-select mb-2" required>
            {% for c in customers %}<option value="{{ c.id }}">{{ c.name }} ({{ c.email }})</option>{% endfor %}
        </select>
        <label class="form-label">Plan</label>
        <select name="plan_id" class="form-select mb-2">
            <option value="">None</option>
            {% for p in plans %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
        <label class="form-label">Product</label>
        <select name="product_id" class="form-select mb-2" required>
            {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
        <label class="form-label">Qty</label>
        <input name="qty" type="number" class="form-control mb-2" value="1">
        <label class="form-label">Start date</label>
        <input name="start_date" type="date" class="form-control mb-2" required>
        <label class="form-label">Payment terms</label>
        <input name="payment_terms" class="form-control mb-3" value="Net 30">
        <button class="btn btn-primary">Create</button>
        <a href="{{ url_for('catalog.subscriptions') }}" class="btn btn-secondary">Back</a>
    </form>
</body>

</html>
